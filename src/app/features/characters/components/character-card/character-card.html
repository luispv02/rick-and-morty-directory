<article
  class="overflow-hidden rounded-2xl border border-gray-800 bg-gray-900 transition duration-300 hover:-translate-y-1 hover:border-green-400/50"
>
  <img
    [src]="character().image"
    [alt]="character().name"
    class="aspect-square w-full object-cover"
  />

  <div class="p-5">
    <h3 class="text-xl font-bold text-white">
      {{ character().name }}
    </h3>

    <p class="mt-2 text-sm text-gray-400">
      {{ character().species }}
    </p>

    <p class="mt-3 text-sm text-gray-300">
      Estado: {{ character().status }}
    </p>

    <button
      type="button"
      class="mt-5 w-full rounded-xl bg-green-400 px-4 py-3 font-semibold text-gray-950 transition hover:bg-green-300 cursor-pointer"
    >
      Ver detalles
    </button>
  </div>
</article>
